name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gywadmin-pki:pr
          cache-from: type=gha,scope=gywadmin-pki-pr
          cache-to: type=gha,mode=max,scope=gywadmin-pki-pr,ignore-error=true
