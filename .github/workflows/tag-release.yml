name: Tag release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          cache: true

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gywadmin-pki") | .version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or verify tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "RELEASE_TOKEN is required" >&2
            exit 1
          fi

          tag="v${VERSION}"
          commit="$(git rev-parse HEAD)"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"

          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$commit" ]]; then
              echo "${tag} already points to ${commit}"
              exit 0
            fi
            echo "Tag ${tag} already exists at ${existing}; refusing to move it" >&2
            exit 1
          fi

          git tag "$tag" "$commit"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${REPOSITORY}.git" "$tag"
