name: Tag release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tag-release-main
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          cache: true

      - name: Read project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gywadmin-pki") | .version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid project version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or verify tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          commit="${{ github.event.pull_request.merge_commit_sha }}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"

          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$commit" ]]; then
              echo "${tag} already points to ${commit}"
              exit 0
            fi
            echo "Tag ${tag} already exists at ${existing}; refusing to move it" >&2
            exit 1
          fi

          git tag "$tag" "$commit"
          git push origin "refs/tags/${tag}"
